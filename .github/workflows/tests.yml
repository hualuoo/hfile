# The whole test suite on SQLite and on MySQL 8.4, on x86-64 and on arm64, on SQLite on Windows too, and the tests
# in a browser, in the environment the project pins: environment.yml, then requirements.lock (docs/development.md).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # release.yml runs the tests before it builds anything

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # In parallel Django copies the test database, on MySQL with mysqldump, which the runner needn't have.
          - name: SQLite
            args: --parallel --exclude-tag browser
          - name: MySQL
            args: --exclude-tag browser
          # The tests in a browser (apps/web/test_browser.py), with the runner's Google Chrome. They may not
          # be skipped here (HFILE_BROWSER_TESTS).
          - name: Browser
            args: --tag browser
          # SQLite and MySQL again on arm64, which release.yml builds the program for too. The tests in a
          # browser only once: the pages' scripts run in the browser, whatever machine the site is on.
          - name: SQLite (arm64)
            runner: ubuntu-24.04-arm
            args: --parallel --exclude-tag browser
          - name: MySQL (arm64)
            runner: ubuntu-24.04-arm
            args: --exclude-tag browser
          # Windows: on SQLite only, as the database works there as here, and the runner can't run the MySQL
          # container.
          - name: SQLite (Windows)
            runner: windows-2025
            args: --parallel --exclude-tag browser
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Miniforge
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/miniforge.sh" \
            "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
          bash "$RUNNER_TEMP/miniforge.sh" -b -p "$RUNNER_TEMP/miniforge3"

      - name: Create the environment
        if: runner.os == 'Linux'
        run: |
          "$RUNNER_TEMP/miniforge3/bin/conda" env create -f environment.yml
          echo "$RUNNER_TEMP/miniforge3/envs/hfile/bin" >> "$GITHUB_PATH"

      # On Windows Miniforge's installer is a program, and an environment's programs are in three folders.
      - name: Install Miniforge and create the environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\miniforge.exe" `
            https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Windows-x86_64.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Start-Process -Wait "$env:RUNNER_TEMP\miniforge.exe" -ArgumentList "/InstallationType=JustMe", "/RegisterPython=0", `
            "/AddToPath=0", "/NoRegistry=1", "/NoShortcuts=1", "/S", "/D=$env:RUNNER_TEMP\miniforge3"
          & "$env:RUNNER_TEMP\miniforge3\Scripts\conda.exe" env create -f environment.yml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $hfile = "$env:RUNNER_TEMP\miniforge3\envs\hfile"
          Add-Content $env:GITHUB_PATH $hfile, "$hfile\Scripts", "$hfile\Library\bin"

      - name: Install the locked versions
        run: |
          pip install -r requirements.lock
          python scripts/lock.py --check

      - name: Write a settings file
        run: |
          mkdir -p "$RUNNER_TEMP/hfile"
          echo "HFILE_CONFIG=$RUNNER_TEMP/hfile/config.toml" >> "$GITHUB_ENV"
          python - "$RUNNER_TEMP/hfile/config.toml" <<'EOF'
          import secrets
          import sys
          from config import configfile
          configfile.create(sys.argv[1])
          configfile.update(sys.argv[1], {"site": {"secret_key": secrets.token_urlsafe(50)}})
          EOF

      - name: Check for missing migrations
        run: python -B manage.py makemigrations --check --dry-run

      - name: Start MySQL
        if: startsWith(matrix.name, 'MySQL')
        # The container developers use: its user may only have the hfile… and test_hfile… databases, as
        # the installer's tests expect.
        run: |
          scripts/dev-db.sh up
          scripts/dev-db.sh use "$HFILE_CONFIG"

      - name: Run the tests
        env:
          HFILE_BROWSER_TESTS: ${{ matrix.name == 'Browser' && 'required' || '' }}
          HFILE_BROWSER_ARTIFACTS: ${{ runner.temp }}/browser
        run: python -B manage.py test ${{ matrix.args }}

      - name: Keep the screenshots of the failed browser tests
        if: failure() && matrix.name == 'Browser'
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/browser
          if-no-files-found: ignore
