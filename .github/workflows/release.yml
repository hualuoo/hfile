# On a tag v<version>: the tag, config/version.py and CHANGELOG.md checked against each other; the tests
# (tests.yml); the single executable built for x86-64 and for arm64, each on the oldest Linux it runs on
# (glibc 2.34, docs/build.md), and for Windows and for macOS on x86-64 and on arm64; then a draft GitHub release with
# the programs, one file with their licenses, the checksums and the version's part of CHANGELOG.md. The draft is
# published by hand once looked over.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Version and notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag against VERSION and CHANGELOG.md
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' config/version.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but config/version.py says $version: the tag must be v$version."
            exit 1
          fi
          awk -v head="## $version" '/^## / {take = ($0 == head); next} take' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section \"## $version\" for the release notes."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  tests:
    needs: check
    uses: ./.github/workflows/tests.yml

  build:
    name: Build (${{ matrix.arch }})
    needs: tests
    # PyInstaller builds a program for the machine it runs on: each architecture on a runner of its own.
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # glibc 2.34: a program built on it runs on it and on newer systems, and cryptography and bcrypt need
    # it anyway (docs/build.md). The image has both architectures.
    container: oraclelinux:9
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git and binutils
        # git for the checkout and scripts/build.sh (git archive HEAD); binutils for PyInstaller (objdump).
        run: dnf install -y git binutils

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Let git work in the checkout
        # The job runs as root in the container and the checkout belongs to the runner's user: git refuses to work
        # in a repository someone else owns ("dubious ownership"), and actions/checkout allows it in its own step only.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Miniforge
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/miniforge.sh" \
            "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
          bash "$RUNNER_TEMP/miniforge.sh" -b -p "$RUNNER_TEMP/miniforge3"

      - name: Create the environment
        run: |
          "$RUNNER_TEMP/miniforge3/bin/conda" env create -f environment.yml
          echo "$RUNNER_TEMP/miniforge3/envs/hfile/bin" >> "$GITHUB_PATH"

      - name: Install the locked versions
        run: pip install -r requirements.lock

      - name: Build
        # It checks the environment against requirements.lock first, and the program it built before it keeps it.
        run: scripts/build.sh

      - name: Check the program's version
        run: |
          said=$(dist/hfile --version)
          echo "$said"
          [ "$(echo "$said" | cut -d' ' -f2)" = "${GITHUB_REF_NAME#v}" ]

      - name: Name the files after the architecture
        # As `uname -m` says it (hfile-linux-x86_64, hfile-linux-aarch64): the download in the README
        # fills it in from there.
        run: |
          name="hfile-linux-$(uname -m)"
          mkdir release
          mv dist/hfile "release/$name"
          mv dist/hfile-licenses.txt "release/$name-licenses.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: hfile-linux-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  build-windows:
    name: Build (Windows ${{ matrix.arch }})
    needs: tests
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # Git for Windows' bash, which scripts/build.sh runs in
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Miniforge and create the environment
        if: runner.arch == 'X64'
        shell: pwsh
        # As in tests.yml.
        run: |
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\miniforge.exe" `
            https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Windows-x86_64.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Start-Process -Wait "$env:RUNNER_TEMP\miniforge.exe" -ArgumentList "/InstallationType=JustMe", "/RegisterPython=0", `
            "/AddToPath=0", "/NoRegistry=1", "/NoShortcuts=1", "/S", "/D=$env:RUNNER_TEMP\miniforge3"
          & "$env:RUNNER_TEMP\miniforge3\Scripts\conda.exe" env create -f environment.yml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $hfile = "$env:RUNNER_TEMP\miniforge3\envs\hfile"
          Add-Content $env:GITHUB_PATH $hfile, "$hfile\Scripts", "$hfile\Library\bin"

      - name: Install Python and OpenSSL (arm64)
        if: runner.arch == 'ARM64'
        uses: ./.github/actions/windows-arm64-python

      - name: Install the locked versions
        # python -m pip, as in tests.yml.
        run: python -m pip install -r requirements.lock

      - name: Build
        run: scripts/build.sh

      - name: Check the program's version
        # Its lines end in \r\n.
        run: |
          said=$(dist/hfile.exe --version | tr -d '\r')
          echo "$said"
          [ "$(echo "$said" | cut -d' ' -f2)" = "${GITHUB_REF_NAME#v}" ]

      - name: Name the files after the system
        # hfile-windows-x86_64.exe, hfile-windows-arm64.exe: Windows calls the latter ARM64 (PROCESSOR_ARCHITECTURE).
        run: |
          mkdir release
          mv dist/hfile.exe "release/hfile-windows-${{ matrix.arch }}.exe"
          mv dist/hfile-licenses.txt "release/hfile-windows-${{ matrix.arch }}-licenses.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: hfile-windows-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    needs: tests
    # Apple silicon and Intel, each on its own runner, as for Linux.
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Miniforge
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/miniforge.sh" \
            "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
          bash "$RUNNER_TEMP/miniforge.sh" -b -p "$RUNNER_TEMP/miniforge3"

      - name: Create the environment
        # As in tests.yml: on Intel pip compiles cryptography, against the environment's OpenSSL.
        run: |
          env="$RUNNER_TEMP/miniforge3/envs/hfile"
          if [ "$RUNNER_ARCH" = X64 ]; then
            export OPENSSL_DIR="$env"
          fi
          "$RUNNER_TEMP/miniforge3/bin/conda" env create -f environment.yml
          echo "$env/bin" >> "$GITHUB_PATH"

      - name: Install the locked versions
        run: pip install -r requirements.lock

      - name: Build
        run: scripts/build.sh

      - name: Check the program's version
        run: |
          said=$(dist/hfile --version)
          echo "$said"
          [ "$(echo "$said" | cut -d' ' -f2)" = "${GITHUB_REF_NAME#v}" ]

      - name: Name the files after the machine
        # As `uname -m` says it (hfile-macos-arm64, hfile-macos-x86_64), as for Linux.
        run: |
          name="hfile-macos-$(uname -m)"
          mkdir release
          mv dist/hfile "release/$name"
          mv dist/hfile-licenses.txt "release/$name-licenses.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: hfile-macos-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [build, build-windows, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        # For scripts/licenses.py, below. First: it would clean away what is downloaded before it.
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: notes

      - uses: actions/download-artifact@v8
        with:
          pattern: hfile-*
          merge-multiple: true
          path: release

      - name: One license file
        # The programs' license files are mostly the same: hfile-licenses.txt has each part once, saying which
        # programs have it when not all of them do (docs/build.md).
        run: |
          python3 scripts/licenses.py merge licenses.txt release/hfile-*-licenses.txt
          rm release/hfile-*-licenses.txt
          mv licenses.txt release/hfile-licenses.txt

      - name: Checksums
        # One file for all of them: sha256sum --check --ignore-missing checks the one downloaded.
        run: cd release && sha256sum hfile-* > SHA256SUMS

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "HFile ${GITHUB_REF_NAME#v}" --notes-file notes.md release/*
